name: FineGuard Pro — Test, Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  AZURE_WEBAPP_NAME: fineguard-prod-app

permissions:
  contents: read

jobs:
  # ─── Test ────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # ─── Build ───────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build production bundle
        env:
          NODE_ENV: production
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
          VITE_OAUTH_PORTAL_URL: ${{ secrets.VITE_OAUTH_PORTAL_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_APP_TITLE: "FineGuard Pro"
          VITE_ANALYTICS_ENDPOINT: ${{ secrets.VITE_ANALYTICS_ENDPOINT }}
          VITE_ANALYTICS_WEBSITE_ID: ${{ secrets.VITE_ANALYTICS_WEBSITE_ID }}
          VITE_APP_LOGO: ${{ secrets.VITE_APP_LOGO }}
        run: pnpm build

      - name: Package deployment artifact
        run: |
          mkdir deploy-pkg
          cp -r dist server drizzle shared package.json pnpm-lock.yaml deploy-pkg/
          [ -f azure/web.config ] && cp azure/web.config deploy-pkg/
          cd deploy-pkg && zip -qr ../fineguard.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: fineguard-build
          path: fineguard.zip
          retention-days: 7

  # ─── Deploy ──────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://fineguardpro.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fineguard-build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: fineguard.zip
          resource-group-name: ${{ secrets.AZURE_RESOURCE_GROUP }}

      - name: Health check
        run: |
          sleep 30
          WEBAPP_URL=$(az webapp show \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "defaultHostName" -o tsv)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$WEBAPP_URL/api/health")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Health check passed"

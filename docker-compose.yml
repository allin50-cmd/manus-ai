version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ultracore-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ultracore}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ultracore-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ultracore-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ultracore-network

  # Actions API Server (Port 4000)
  actions-api:
    build:
      context: .
      dockerfile: Dockerfile.actions
    container_name: ultracore-actions-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ultracore}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./actions-server.js:/app/actions-server.js
      - ./node_modules:/app/node_modules
    networks:
      - ultracore-network
    restart: unless-stopped

  # Dashboard Server (Port 3001 in Docker, 3000 when run directly)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: ultracore-dashboard
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DASHBOARD_PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ultracore}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_ACCOUNT: ${STORAGE_ACCOUNT:-ultaivaultstore}
      KEYVAULT_NAME: ${KEYVAULT_NAME:-ultracore-kv}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./index.js:/app/index.js
    networks:
      - ultracore-network
    restart: unless-stopped

  # Jobe AI Agent API Server (Port 3000)
  jobe-api:
    build:
      context: .
      dockerfile: Dockerfile.jobe
    container_name: ultracore-jobe-api
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      JOBE_PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ultracore}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./jobe-server.js:/app/jobe-server.js
      - ./node_modules:/app/node_modules
    networks:
      - ultracore-network
    restart: unless-stopped

  # PgAdmin (Optional - Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ultracore-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ultracore.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    depends_on:
      - postgres
    networks:
      - ultracore-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ultracore-network:
    driver: bridge

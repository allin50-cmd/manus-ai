name: Feature Request
description: Suggest a new feature or enhancement for FineGuard Pro
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Describe your current workflow pain point.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Company monitoring
        - Alerts
        - Client management
        - Reports
        - Billing
        - API / integrations
        - White-label / branding
        - Documentation
        - Other

  - type: dropdown
    id: user_type
    attributes:
      label: I am a…
      options:
        - Accountancy firm user
        - Business owner
        - Enterprise / API user
        - Developer
